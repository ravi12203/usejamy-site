<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks | JAMY</title>
<meta name="description" content="JAMY helps bank teams understand, change and clean up their COBOL without AI: it explains every program, proves what every change did, and finds dead code. Offline, on a Windows PC.">
<meta property="og:title" content="JAMY: understand, change and clean up COBOL, without AI">
<meta property="og:description" content="Built to extend the life of your COBOL, not to replace it. Offline, on a Windows PC.">
<meta property="og:url" content="https://usejamy.com/">
<meta property="og:image" content="https://usejamy.com/img/shot-understand.png">
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --navy: #0F2A4A;
  --navy-d: #0A1E36;
  --ink: #14213D;
  --body: #3D4A5C;
  --paper: #F4F6F5;
  --white: #FCFDFC;
  --bar: #E2EEE4;
  --line: #D2D9D6;
  --teal: #1F6F6B;
  --mist: #C5D3E2;
  --blue: #1D5FA8;
  --blue-bg: #DFEAF7;
  --ok: #1B7F3B;
  --ok-bg: #DFF1E3;
  --amber: #E8B04B;
  --warn: #9A6200;
  --warn-bg: #FBEFD3;
  --del: #A33A2B;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; font-family: 'IBM Plex Sans', Arial, sans-serif; color: var(--ink); background: var(--paper); font-size: 18px; line-height: 1.6; }
img, svg { max-width: 100%; display: block; }
img { height: auto; }
a { color: var(--teal); }
a:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
h1, h2, h3 { line-height: 1.15; margin: 0; }
h2 { font-size: clamp(30px, 3.8vw, 44px); font-weight: 700; margin-bottom: 14px; letter-spacing: -0.3px; }
h3 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
p { margin: 0 0 14px; }
.lede { font-size: 20px; color: var(--body); max-width: 760px; margin-bottom: 40px; }
.ic { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* header and hero */
.top { color: var(--white); background:
  radial-gradient(900px 520px at 88% 18%, #23578F 0%, rgba(35, 87, 143, 0) 62%),
  radial-gradient(700px 500px at 0% 100%, #134a5a 0%, rgba(19, 74, 90, 0) 60%),
  repeating-linear-gradient(0deg, rgba(255, 255, 255, .028) 0 28px, rgba(255, 255, 255, 0) 28px 56px),
  var(--navy); }
.nav { display: flex; align-items: center; gap: 28px; padding: 18px 0; }
.brand { display: flex; align-items: center; gap: 12px; color: var(--white); text-decoration: none; font-weight: 700; font-size: 22px; letter-spacing: 1px; }
.brand img { width: 40px; height: 40px; }
.nav .links { display: flex; gap: 24px; margin-left: auto; }
.nav .links a { color: var(--mist); text-decoration: none; font-size: 16px; }
.nav .links a:hover { color: var(--white); text-decoration: underline; }
.btn { display: inline-block; font: inherit; font-weight: 600; font-size: 17px; text-decoration: none; border-radius: 8px; padding: 12px 24px; border: 2px solid transparent; cursor: pointer; }
.btn.gold { background: var(--amber); color: var(--navy-d); }
.btn.gold:hover { background: #F2C063; }
.btn.light { background: var(--white); color: var(--navy); }
.btn.ghost { border-color: rgba(197, 211, 226, .7); color: var(--white); }
.btn.dark { background: var(--navy); color: var(--white); }
.nav .btn { padding: 8px 18px; font-size: 16px; }

.hero { display: grid; grid-template-columns: 1fr 1.08fr; gap: 60px; align-items: center; padding: 44px 0 110px; }
.pill { display: inline-flex; align-items: center; gap: 10px; font-size: 15.5px; font-weight: 600; color: #FCEBC4; background: rgba(232, 176, 75, .16); border: 1px solid rgba(232, 176, 75, .5); border-radius: 999px; padding: 6px 16px; margin-bottom: 22px; }
.pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); }
.hero h1 { font-size: clamp(40px, 5.6vw, 66px); font-weight: 700; letter-spacing: -0.8px; margin-bottom: 22px; }
.hero .sub { font-size: 21px; color: var(--mist); margin-bottom: 30px; max-width: 540px; }
.hero .actions { display: flex; flex-wrap: wrap; gap: 14px; }

.stage { position: relative; padding: 0 0 54px 0; }
.listing { background: var(--white); color: var(--ink); border-radius: 10px; overflow: hidden; box-shadow: 0 24px 60px rgba(3, 12, 26, .55); transform: rotate(-1.2deg); }
.listing .head { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 14px; color: var(--body); border-bottom: 1px solid var(--line); background: #EEF2F0; }
.listing .head b { margin-right: auto; font-weight: 600; color: var(--ink); }
.dot { width: 11px; height: 11px; border-radius: 50%; background: #C9D2CE; }
.listing pre { margin: 0; font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 14.5px; line-height: 28px; overflow-x: auto; background: repeating-linear-gradient(var(--white) 0 28px, var(--bar) 28px 56px); }
.listing pre .ln { display: block; padding: 0 16px; white-space: pre; }
.listing .seq { color: #7C8A86; }
.listing .old { color: var(--del); background: rgba(163, 58, 43, .09); }
.listing .old .t { text-decoration: line-through; text-decoration-color: rgba(163, 58, 43, .7); }
.listing .new { color: var(--ok); font-weight: 500; background: rgba(27, 127, 59, .13); }
.proof { position: absolute; right: -14px; bottom: 0; width: min(360px, 88%); background: var(--white); color: var(--ink); border-radius: 10px; padding: 16px 18px 14px; box-shadow: 0 20px 44px rgba(3, 12, 26, .5); border-top: 5px solid var(--ok); transform: rotate(1.4deg); }
.proof .t { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; margin-bottom: 8px; }
.proof ul { list-style: none; margin: 0; padding: 0; font-size: 15px; color: var(--body); }
.proof li { padding-left: 26px; position: relative; margin-bottom: 4px; }
.proof li::before { content: ""; position: absolute; left: 2px; top: 7px; width: 12px; height: 6px; border-left: 2.5px solid var(--ok); border-bottom: 2.5px solid var(--ok); transform: rotate(-45deg); }
.chip { display: inline-block; font-weight: 600; font-size: 15px; border-radius: 5px; padding: 2px 10px; }
.chip.ok { color: var(--ok); background: var(--ok-bg); }
.chip.read { color: var(--blue); background: var(--blue-bg); }
.chip.warn { color: var(--warn); background: var(--warn-bg); }

@media (prefers-reduced-motion: no-preference) {
  .listing .new { animation: mark 900ms ease-out 500ms both; }
  .proof { animation: stamp 500ms cubic-bezier(.2, .9, .3, 1.2) 1300ms both; }
  @keyframes mark { from { background: rgba(27, 127, 59, 0); color: var(--ink); } }
  @keyframes stamp { from { opacity: 0; transform: rotate(1.4deg) translateY(18px) scale(.96); } }
}

/* trust band */
.band { margin-top: -56px; position: relative; z-index: 2; }
.band .in { background: var(--white); border-radius: 12px; box-shadow: 0 14px 34px rgba(15, 42, 74, .16); display: grid; grid-template-columns: repeat(4, 1fr); }
.band .it { display: flex; gap: 14px; align-items: center; padding: 22px 24px; border-right: 1px solid var(--line); }
.band .it:last-child { border-right: 0; }
.band .badge { flex: none; width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; color: var(--navy); background: #E4ECF5; }
.band b { display: block; font-size: 17px; line-height: 1.25; }
.band span { font-size: 14.5px; color: var(--body); line-height: 1.35; display: block; }

section { padding: 88px 0; }
section.tint { background: #E9EEEC; }
section.dark { color: var(--white); background:
  repeating-linear-gradient(0deg, rgba(255, 255, 255, .028) 0 28px, rgba(255, 255, 255, 0) 28px 56px), var(--navy); }
section.dark h2 { color: var(--white); }
section.dark .lede { color: var(--mist); }

/* feature rows */
.feat { display: grid; grid-template-columns: 1fr 1.35fr; gap: 64px; align-items: center; margin-bottom: 96px; }
.feat:last-child { margin-bottom: 0; }
.feat.flip { grid-template-columns: 1.35fr 1fr; }
.feat.flip .txt { order: 2; }
.feat .tag { display: inline-flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; margin-bottom: 14px; }
.feat .tag .badge { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; }
.feat h3 { font-size: 30px; font-weight: 700; margin-bottom: 14px; letter-spacing: -0.2px; }
.feat ul { list-style: none; margin: 0; padding: 0; color: var(--body); }
.feat li { padding-left: 32px; position: relative; margin-bottom: 10px; }
.feat li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 15px; height: 8px; border-left: 3px solid var(--c); border-bottom: 3px solid var(--c); transform: rotate(-45deg); }
.f-blue { --c: var(--blue); --cb: var(--blue-bg); }
.f-green { --c: var(--ok); --cb: var(--ok-bg); }
.f-amber { --c: #B7791F; --cb: var(--warn-bg); }
.feat .tag { color: var(--c); }
.feat .tag .badge { background: var(--cb); color: var(--c); }
.frame { position: relative; margin: 0; }
.frame::before { content: ""; position: absolute; inset: 26px -18px -18px 26px; border-radius: 14px; background: var(--cb); z-index: 0; }
.frame img { position: relative; z-index: 1; border-radius: 10px; border: 1px solid var(--line); background: #FDFDFC; box-shadow: 0 18px 40px rgba(15, 42, 74, .18); }
.frame figcaption { position: relative; z-index: 1; font-size: 14.5px; color: var(--body); margin-top: 28px; }

/* problems */
.problems { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.prob { background: var(--white); border-radius: 12px; padding: 24px 26px; display: flex; gap: 18px; border: 1px solid var(--line); }
.prob .badge { flex: none; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: #FBE9E5; color: var(--del); }
.prob p { margin: 0; color: var(--body); }

/* diagram */
.diagram { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 26px 20px 14px; margin-bottom: 36px; box-shadow: 0 10px 28px rgba(15, 42, 74, .08); }
.diagram svg { width: 100%; height: auto; font-family: 'IBM Plex Sans', Arial, sans-serif; }
.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.steps li { counter-increment: s; position: relative; padding-left: 52px; color: var(--body); }
.steps li::before { content: counter(s); position: absolute; top: 0; left: 0; width: 38px; height: 38px; border-radius: 50%; background: var(--navy); color: var(--white); font-weight: 700; display: grid; place-items: center; }
.steps b { display: block; color: var(--ink); font-size: 19px; margin-bottom: 2px; }

/* verdicts */
.verdicts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.verd { background: var(--white); border-radius: 12px; padding: 26px; border-top: 6px solid var(--c); box-shadow: 0 8px 22px rgba(15, 42, 74, .07); }
.verd .chip { font-size: 17px; padding: 4px 14px; margin-bottom: 14px; }
.verd p { margin: 0; color: var(--body); }

/* compare table */
.cmp { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--white); border-radius: 14px; overflow: hidden; box-shadow: 0 10px 28px rgba(15, 42, 74, .1); font-size: 17px; }
.cmp th, .cmp td { padding: 16px 20px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
.cmp tr:last-child td { border-bottom: 0; }
.cmp thead th { font-size: 18px; background: #EEF2F0; }
.cmp thead th.us { background: var(--navy); color: var(--white); }
.cmp td.us { background: #F1F8F2; font-weight: 500; }
.cmp td:first-child { font-weight: 600; width: 24%; }
.yes, .no, .mid { display: inline-block; width: 22px; height: 22px; border-radius: 50%; margin-right: 8px; vertical-align: -4px; position: relative; }
.yes { background: var(--ok); }
.yes::after { content: ""; position: absolute; left: 6px; top: 6px; width: 9px; height: 5px; border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff; transform: rotate(-45deg); }
.no { background: #C4553F; }
.no::after { content: ""; position: absolute; left: 5px; top: 10px; width: 12px; height: 2.5px; background: #fff; }
.mid { background: #C9952E; }
.mid::after { content: ""; position: absolute; left: 9.5px; top: 5px; width: 3px; height: 8px; background: #fff; box-shadow: 0 10px 0 0 #fff; height: 7px; }

/* covers */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.box { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 28px 30px; }
.box h3 { display: flex; align-items: center; gap: 12px; }
.box ul { margin: 12px 0 0; padding-left: 22px; color: var(--body); }
.box li { margin-bottom: 8px; }
.box .more { margin: 14px 0 0; color: var(--body); }
.box.y { border-top: 6px solid var(--ok); }
.box.n { border-top: 6px solid #C9952E; }
.aside { margin-top: 26px; background: var(--blue-bg); border-radius: 12px; padding: 18px 22px; color: var(--ink); }

/* security */
.safe { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.safe .card { background: rgba(255, 255, 255, .07); border: 1px solid rgba(197, 211, 226, .28); border-radius: 12px; padding: 24px; }
.safe .badge { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: rgba(127, 212, 154, .16); color: #8FE0A9; margin-bottom: 14px; }
.safe b { display: block; font-size: 19px; margin-bottom: 4px; }
.safe p { margin: 0; color: var(--mist); font-size: 16.5px; }

/* who */
.who { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.who .card { background: var(--white); border-radius: 12px; padding: 28px; border: 1px solid var(--line); }
.who .badge { width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; background: #E4ECF5; color: var(--navy); margin-bottom: 16px; }
.who p { color: var(--body); margin: 0; }

/* start */
.start { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; counter-reset: st; }
.start .card { background: var(--white); border-radius: 12px; padding: 28px; position: relative; border: 1px solid var(--line); }
.start .card::before { counter-increment: st; content: counter(st); display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--amber); color: var(--navy-d); font-weight: 700; font-size: 20px; margin-bottom: 14px; }
.start .card.first { background: var(--navy); color: var(--white); border-color: var(--navy); }
.start .card.first p { color: var(--mist); }
.start p { color: var(--body); margin: 0; }

/* cta */
.cta { background: linear-gradient(100deg, #174a6b 0%, var(--navy) 60%); color: var(--white); border-radius: 18px; padding: 44px 48px; display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
.cta h2 { color: var(--white); margin: 0 0 6px; }
.cta p { margin: 0; color: var(--mist); font-size: 19px; }
.cta .btn { margin-left: auto; }

.faq { max-width: 900px; display: grid; gap: 12px; }
.faq details { background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 0 22px; }
.faq summary { cursor: pointer; font-weight: 600; font-size: 19px; padding: 16px 0; }
.faq details p { color: var(--body); padding: 0 0 18px; margin: 0; }

.founder .wrap { display: grid; grid-template-columns: 200px 1fr; gap: 48px; align-items: center; }
.founder .seal { width: 200px; height: 200px; }
.founder p { color: var(--mist); max-width: 780px; }
.founder blockquote { margin: 22px 0 0; padding-left: 24px; border-left: 5px solid var(--amber); color: var(--white); font-size: 22px; max-width: 780px; }

.contact .wrap { display: grid; grid-template-columns: 1fr 1.3fr; gap: 56px; }
.contact .lede { margin-bottom: 20px; }
.contact .side li { margin-bottom: 8px; color: var(--body); }
.contact form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; background: var(--white); border-radius: 14px; padding: 30px; border: 1px solid var(--line); box-shadow: 0 10px 28px rgba(15, 42, 74, .08); }
.contact label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 6px; }
.contact input, .contact select, .contact textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: #fff; border: 1px solid #AEB8B4; border-radius: 8px; padding: 10px 12px; }
.contact textarea { min-height: 130px; resize: vertical; }
.contact .full { grid-column: 1 / -1; }
.contact .hp { position: absolute; left: -9999px; }
.contact .small { font-size: 14px; color: var(--body); margin: 0; }

footer { background: var(--navy-d); color: var(--mist); padding: 40px 0; font-size: 15.5px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 20px 40px; align-items: center; }
footer .brand { font-size: 19px; }
footer .brand img { width: 34px; height: 34px; }
footer a { color: var(--white); }
footer .fl { margin-left: auto; display: flex; gap: 22px; flex-wrap: wrap; }
footer .fl a { color: var(--mist); text-decoration: none; }
footer p { margin: 0; flex-basis: 100%; }

@media (max-width: 960px) {
  .hero, .feat, .feat.flip, .cols, .problems, .contact .wrap, .founder .wrap { grid-template-columns: 1fr; }
  .hero { gap: 44px; padding-bottom: 96px; }
  .feat { gap: 32px; margin-bottom: 64px; }
  .feat.flip .txt { order: 0; }
  .band .in { grid-template-columns: 1fr 1fr; }
  .band .it:nth-child(2) { border-right: 0; }
  .band .it:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .steps, .verdicts, .safe, .who, .start { grid-template-columns: 1fr; }
  .diagram { display: none; }
  .nav .links { display: none; }
  .nav .btn { margin-left: auto; }
  section { padding: 60px 0; }
  .contact form { grid-template-columns: 1fr; padding: 22px; }
  .founder .seal { width: 120px; height: 120px; }
  .cta { padding: 32px 26px; }
  .cta .btn { margin-left: 0; }
  .cmp { font-size: 15px; }
  .cmp th, .cmp td { padding: 12px 10px; }
  .frame::before { inset: 18px -10px -12px 18px; }
  .proof { right: 0; }
}
@media (max-width: 560px) {
  .band .in { grid-template-columns: 1fr; }
  .band .it { border-right: 0; border-bottom: 1px solid var(--line); }
  .band .it:last-child { border-bottom: 0; }
  .listing pre { font-size: 12.5px; }
  .cmp-wrap { overflow-x: auto; }
  .cmp { min-width: 560px; }
}
</style>
</head>
<body>
<header class="top" style="min-height:100vh">
  <div class="wrap">
    <nav class="nav" aria-label="Main"><a class="brand" href="/"><img src="img/jamy-seal.svg" alt="">JAMY</a></nav>
    <div class="hero" style="grid-template-columns:1fr">
      <div>
        <h1>Thanks. We got your message.</h1>
        <p class="sub">We’ll get back to you by email soon.</p>
        <div class="actions"><a class="btn gold" href="/">Back to usejamy.com</a></div>
      </div>
    </div>
  </div>
</header>
