<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks | JAMY</title>
<meta name="description" content="JAMY helps bank teams understand, change and clean up their COBOL without AI: it explains every program, proves what every change did, and finds dead code. Offline, on a Windows PC.">
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
<style>
:root {
  --navy: #0F2A4A;
  --paper: #F6F5F0;
  --paper2: #ECEAE3;
  --ink: #14213D;
  --body: #3E4A5C;
  --teal: #1F6F6B;
  --mist: #C3D1E0;
  --line: #D5D2C8;
  --amber: #E8B04B;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: 'Public Sans', Arial, sans-serif; color: var(--ink); background: var(--paper); font-size: 18px; line-height: 1.6; }
a { color: var(--teal); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
header { background: var(--navy); color: var(--paper); }
.bar { display: flex; align-items: center; gap: 14px; padding: 20px 0; }
.bar img { width: 40px; height: 40px; }
.bar .name { font-weight: 700; font-size: 22px; letter-spacing: 1px; }
.hero { padding: 56px 0 72px; }
.hero h1 { font-size: clamp(36px, 6vw, 60px); line-height: 1.08; margin: 0 0 20px; color: var(--paper); }
.hero p { font-size: clamp(18px, 2.2vw, 22px); color: var(--mist); max-width: 720px; margin: 0; }
section { padding: 64px 0; }
section.alt { background: var(--paper2); }
h2 { font-size: clamp(26px, 3.6vw, 36px); line-height: 1.2; margin: 0 0 24px; }
.point { border-left: 5px solid var(--teal); padding: 2px 0 2px 20px; margin: 0 0 22px; color: var(--body); max-width: 820px; }
.point b { color: var(--ink); }
.split { display: grid; grid-template-columns: 1fr 1.4fr; gap: 40px; align-items: start; }
ol.steps { margin: 0; padding-left: 24px; color: var(--body); }
ol.steps li { margin: 0 0 14px; }
figure { margin: 0; }
figure img { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; background: #FDFDFC; display: block; }
figcaption { font-size: 15px; color: var(--body); margin-top: 8px; }
.parts p { margin: 0 0 16px; color: var(--body); }
.parts b { color: var(--ink); }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.fact { border-top: 4px solid var(--teal); padding-top: 16px; }
.fact .n { font-size: 40px; font-weight: 700; line-height: 1.1; margin: 0 0 6px; }
.fact p { margin: 0; color: var(--body); }
.founder { background: var(--navy); color: var(--paper); }
.founder h2 { color: var(--paper); }
.founder p { color: var(--mist); max-width: 780px; }
.founder blockquote { margin: 28px 0 0; padding-left: 24px; border-left: 5px solid var(--amber); color: var(--paper); font-size: 21px; max-width: 780px; }
footer { padding: 32px 0 48px; color: var(--body); font-size: 15px; }
.bar .spacer { flex: 1; }
.bar a.cta { color: var(--navy); background: var(--paper); text-decoration: none; font-weight: 600; font-size: 16px; padding: 8px 16px; border-radius: 6px; }
.contact form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; max-width: 820px; }
.contact label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 6px; }
.contact input, .contact select, .contact textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: #FDFDFC; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.contact textarea { min-height: 140px; resize: vertical; }
.contact .full { grid-column: 1 / -1; }
.contact .hp { position: absolute; left: -9999px; }
.contact button { font: inherit; font-weight: 700; font-size: 17px; color: var(--paper); background: var(--navy); border: 0; border-radius: 6px; padding: 12px 28px; cursor: pointer; }
.contact .small { font-size: 14px; color: var(--body); margin: 0; }
@media (max-width: 760px) {
  .split, .facts, .contact form { grid-template-columns: 1fr; }
  section { padding: 44px 0; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar"><img src="img/jamy-seal.svg" alt="JAMY logo"><span class="name">JAMY</span></div>
    <div class="hero">
      <h1>Thanks. We got your message.</h1>
      <p>We’ll get back to you by email soon.</p>
    </div>
  </div>
</header>
<section>
  <div class="wrap"><p><a href="/">Back to usejamy.com</a></p></div>
</section>
</body>
</html>
